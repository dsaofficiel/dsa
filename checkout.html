<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKOUT | DSA STREETWEAR</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #FEFEFE; color: #000; line-height: 1.5; }
        a { text-decoration: none; color: inherit; }

        /* HEADER */
        header { display: flex; justify-content: center; align-items: center; padding: 25px 0; border-bottom: 1px solid #eee; }
        .header-logo-img { height: 35px; width: auto; filter: invert(1); }
        .back-to-cart { position: absolute; left: 40px; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; transition: color 0.3s; }
        .back-to-cart:hover { color: #555; }
        .back-to-cart svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.5; transition: stroke 0.3s; }

        /* LAYOUT CHECKOUT */
        .checkout-container { display: flex; max-width: 1200px; margin: 0 auto; min-height: calc(100vh - 86px); }
        
        /* CỘT TRÁI: FORM THÔNG TIN */
        .checkout-left { flex: 5.5; padding: 50px 40px 50px 20px; border-right: 1px solid #eee; }
        .section-title { font-size: 18px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 15px; border: 1px solid #ddd; font-family: 'Inter', sans-serif; font-size: 14px; background: #fff; outline: none; transition: border 0.3s; }
        .form-control:focus { border-color: #000; }
        
        .shipping-note { font-size: 12px; color: #d32f2f; font-weight: 500; padding: 12px 15px; background: #fff0f0; border-left: 3px solid #d32f2f; margin-bottom: 20px; line-height: 1.6; }
        
        .payment-method { border: 1px solid #000; padding: 15px; background: #fafafa; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
        .payment-method input { accent-color: #000; width: 16px; height: 16px; }

        .submit-btn { width: 100%; background: #000; color: #fff; border: none; padding: 20px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: background 0.3s; }
        .submit-btn:hover { background: #333; }
        .submit-btn:disabled { background: #888; cursor: not-allowed; }

        /* CỘT PHẢI: TÓM TẮT ĐƠN HÀNG */
        .checkout-right { flex: 4.5; padding: 50px 20px 50px 40px; background: #fafafa; }
        .order-summary { position: sticky; top: 50px; }
        
        .summary-item { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .summary-img { width: 65px; height: 80px; background: #eee; position: relative; }
        .summary-img img { width: 100%; height: 100%; object-fit: cover; }
        .summary-qty { position: absolute; top: -8px; right: -8px; background: #777; color: #fff; font-size: 11px; font-weight: 600; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .summary-info { flex: 1; }
        .summary-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }
        .summary-size { font-size: 12px; color: #666; }
        .summary-price { font-size: 13px; font-weight: 500; }

        .summary-lines { border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 20px 0; margin: 20px 0; }
        .summary-line { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 15px; color: #444; }
        .summary-line:last-child { margin-bottom: 0; }
        .summary-total { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 600; text-transform: uppercase; color: #000; }
        
        /* MÀN HÌNH CHỜ (LOADING OVERLAY) */
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .loading-overlay.active { opacity: 1; visibility: visible; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .checkout-container { flex-direction: column; }
            .checkout-left { order: 2; padding: 40px 20px; border-right: none; }
            .checkout-right { order: 1; padding: 40px 20px; border-bottom: 1px solid #eee; }
            .back-to-cart { left: 20px; font-size: 0; } /* Ẩn chữ, giữ lại icon mũi tên */
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-to-cart">
            <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            BACK TO CART
        </a>
        <a href="index.html"><img src="logo.png" alt="DSA" class="header-logo-img"></a>
    </header>

    <div class="checkout-container">
        
        <!-- CỘT TRÁI: FORM -->
        <div class="checkout-left">
            <h2 class="section-title">SHIPPING INFORMATION</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="customerName" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="customerPhone" required placeholder="Enter your phone number">
                </div>

                <div class="shipping-note">
                    Note: Please select the correct Province/City. Shipping fees will be applied automatically based on your location.
                </div>

                <div class="form-group">
                    <label class="form-label">Province / City</label>
                    <!-- Chuyển thành Datalist để khách gõ nhanh và tự động gợi ý -->
                    <input list="provinces" class="form-control" id="provinceInput" required placeholder="Type or select your Province/City">
                    <datalist id="provinces">
                        <option value="TP. Hồ Chí Minh">
                        <option value="Hà Nội">
                        <option value="Đà Nẵng">
                        <option value="Hải Phòng">
                        <option value="Cần Thơ">
                        <option value="An Giang">
                        <option value="Bà Rịa - Vũng Tàu">
                        <option value="Bắc Giang">
                        <option value="Bắc Kạn">
                        <option value="Bạc Liêu">
                        <option value="Bắc Ninh">
                        <option value="Bến Tre">
                        <option value="Bình Định">
                        <option value="Bình Dương">
                        <option value="Bình Phước">
                        <option value="Bình Thuận">
                        <option value="Cà Mau">
                        <option value="Cao Bằng">
                        <option value="Đắk Lắk">
                        <option value="Đắk Nông">
                        <option value="Điện Biên">
                        <option value="Đồng Nai">
                        <option value="Đồng Tháp">
                        <option value="Gia Lai">
                        <option value="Hà Giang">
                        <option value="Hà Nam">
                        <option value="Hà Tĩnh">
                        <option value="Hải Dương">
                        <option value="Hậu Giang">
                        <option value="Hòa Bình">
                        <option value="Hưng Yên">
                        <option value="Khánh Hòa">
                        <option value="Kiên Giang">
                        <option value="Kon Tum">
                        <option value="Lai Châu">
                        <option value="Lâm Đồng">
                        <option value="Lạng Sơn">
                        <option value="Lào Cai">
                        <option value="Long An">
                        <option value="Nam Định">
                        <option value="Nghệ An">
                        <option value="Ninh Bình">
                        <option value="Ninh Thuận">
                        <option value="Phú Thọ">
                        <option value="Phú Yên">
                        <option value="Quảng Bình">
                        <option value="Quảng Nam">
                        <option value="Quảng Ngãi">
                        <option value="Quảng Ninh">
                        <option value="Quảng Trị">
                        <option value="Sóc Trăng">
                        <option value="Sơn La">
                        <option value="Tây Ninh">
                        <option value="Thái Bình">
                        <option value="Thái Nguyên">
                        <option value="Thanh Hóa">
                        <option value="Thừa Thiên Huế">
                        <option value="Tiền Giang">
                        <option value="Trà Vinh">
                        <option value="Tuyên Quang">
                        <option value="Vĩnh Long">
                        <option value="Vĩnh Phúc">
                        <option value="Yên Bái">
                    </datalist>
                </div>

                <div class="form-group">
                    <label class="form-label">Detailed Address</label>
                    <input type="text" class="form-control" id="customerAddress" required placeholder="House number, Street, Ward, District">
                </div>

                <h2 class="section-title" style="margin-top: 40px;">PAYMENT METHOD</h2>
                <div class="payment-method">
                    <input type="radio" checked readonly>
                    <span>Cash on Delivery (COD)</span>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">COMPLETE ORDER</button>
            </form>
        </div>

        <!-- CỘT PHẢI: ORDER SUMMARY -->
        <div class="checkout-right">
            <div class="order-summary">
                <div id="summaryItemsContainer">
                    <!-- Dữ liệu Giỏ hàng sẽ được JS đổ vào đây -->
                </div>
                
                <div class="summary-lines">
                    <div class="summary-line">
                        <span>Subtotal</span>
                        <span id="summarySubtotal">0 VND</span>
                    </div>
                    <div class="summary-line">
                        <span>Shipping</span>
                        <span id="summaryShipping">Calculated next step</span>
                    </div>
                </div>

                <div class="summary-total">
                    <span>TOTAL</span>
                    <span id="summaryTotal">0 VND</span>
                </div>
            </div>
        </div>

    </div>

    <!-- OVERLAY LOADING KHI BẤM NÚT SUBMIT -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p style="font-weight: 500; font-size: 14px; letter-spacing: 1px;">PROCESSING YOUR ORDER...</p>
    </div>

    <!-- JAVASCRIPT XỬ LÝ LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // === 1. LẤY DỮ LIỆU TỪ GIỎ HÀNG (LOCAL STORAGE) VÀ HIỂN THỊ ===
            let cart = JSON.parse(localStorage.getItem('dsa_cart')) || [];
            
            // Khóa bảo vệ: Nếu vô tình mở trang checkout mà chưa có hàng, đá về trang chủ
            if (cart.length === 0) {
                alert("Your cart is currently empty. Redirecting to home page.");
                window.location.href = "index.html";
                return;
            }

            const summaryContainer = document.getElementById('summaryItemsContainer');
            const summarySubtotal = document.getElementById('summarySubtotal');
            const summaryShipping = document.getElementById('summaryShipping');
            const summaryTotal = document.getElementById('summaryTotal');
            
            let subtotal = 0;
            let shippingFee = 0;

            const formatPrice = (price) => new Intl.NumberFormat('vi-VN').format(price) + ' VND';

            let orderProductsText = ""; 

            // Vòng lặp render sản phẩm ra màn hình
            cart.forEach(item => {
                subtotal += (item.price * item.qty);
                orderProductsText += `- ${item.name} (Size: ${item.size}) x${item.qty}\n`;

                const itemHTML = `
                    <div class="summary-item">
                        <div class="summary-img">
                            <img src="${item.img}" alt="${item.name}">
                            <span class="summary-qty">${item.qty}</span>
                        </div>
                        <div class="summary-info">
                            <div class="summary-name">${item.name}</div>
                            <div class="summary-size">Size: ${item.size}</div>
                        </div>
                        <div class="summary-price">${formatPrice(item.price * item.qty)}</div>
                    </div>
                `;
                summaryContainer.insertAdjacentHTML('beforeend', itemHTML);
            });

            summarySubtotal.textContent = formatPrice(subtotal);
            summaryTotal.textContent = formatPrice(subtotal); // Hiển thị tạm khi chưa tính phí ship

            // === 2. LOGIC TÍNH PHÍ SHIP TỰ ĐỘNG THEO TEXT ĐÃ NHẬP ===
            const provinceInput = document.getElementById('provinceInput');
            
            provinceInput.addEventListener('input', function() {
                const val = this.value.trim().toLowerCase();
                
                if (val === "") {
                    shippingFee = 0;
                    summaryShipping.textContent = "Calculated next step";
                } else if (val.includes("hồ chí minh") || val.includes("hcm") || val.includes("ho chi minh")) {
                    shippingFee = 16500;
                    summaryShipping.textContent = formatPrice(shippingFee);
                } else {
                    // Bất kỳ chữ nào gõ vào mà không phải HCM thì mặc định 24k
                    shippingFee = 24000;
                    summaryShipping.textContent = formatPrice(shippingFee);
                }
                
                // Cập nhật lại số Tổng cuối cùng
                summaryTotal.textContent = formatPrice(subtotal + shippingFee);
            });

            // === 3. XỬ LÝ GỬI FORM VỀ GOOGLE SHEETS ===
            const checkoutForm = document.getElementById('checkoutForm');
            const submitBtn = document.getElementById('submitBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');

            // ĐÃ GẮN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMIzpRPhbj5n23O01mcj_BZhpy3fgtJTwKyd0RmgnDnmhpd0vM50iUK1BZZaKhzmsV/exec'; 

            checkoutForm.addEventListener('submit', function(e) {
                e.preventDefault();

                if (shippingFee === 0) {
                    alert("Please select or enter your Province/City to calculate shipping fee.");
                    provinceInput.focus();
                    return;
                }

                if (SCRIPT_URL === 'ĐIỀN_LINK_APP_SCRIPT_VÀO_ĐÂY') {
                    alert("System error: Google Sheets endpoint is missing.");
                    return;
                }

                submitBtn.disabled = true;
                loadingOverlay.classList.add('active');

                // Đóng gói data gửi đi
                const formData = new FormData();
                formData.append('name', document.getElementById('customerName').value);
                formData.append('phone', document.getElementById('customerPhone').value);
                formData.append('province', provinceInput.value);
                formData.append('address', document.getElementById('customerAddress').value);
                formData.append('products', orderProductsText);
                formData.append('subtotal', formatPrice(subtotal));
                formData.append('shipping', formatPrice(shippingFee));
                formData.append('total', formatPrice(subtotal + shippingFee));

                // Bắn Data tới Sheets
                fetch(SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' })
                .then(() => {
                    localStorage.removeItem('dsa_cart'); // Xóa giỏ hàng khi thành công
                    loadingOverlay.classList.remove('active');
                    alert("🎉 ORDER PLACED SUCCESSFULLY!\nWe will contact you shortly to confirm your order.");
                    window.location.href = "index.html"; // Trả về trang chủ
                })
                .catch(error => {
                    loadingOverlay.classList.remove('active');
                    submitBtn.disabled = false;
                    alert("An error occurred. Please try again later!");
                    console.error('Error!', error.message);
                });
            });
        });
    </script>
</body>
</html>
