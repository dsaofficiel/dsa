<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrant</title>
    <style>
        /* Import font chữ tương đồng với bản gốc */
        @import url('https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        /* Thanh thông báo màu trắng trên cùng */
        .top-bar {
            background-color: #fff;
            color: #000;
            text-align: center;
            padding: 4px 0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 100;
        }

        /* Vùng Header chứa Menu */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 30px;
            position: absolute;
            width: 100%;
            top: 25px; /* Nằm ngay dưới thanh top-bar */
            z-index: 50;
        }

        /* Khối bo tròn chứa Logo và Link bên trái */
        .nav-left {
            background: linear-gradient(180deg, rgba(40,40,40,0.85) 0%, rgba(15,15,15,0.85) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 40px;
            display: flex;
            align-items: center;
            padding: 10px 30px 10px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Logo text và icon mô phỏng */
        .logo {
            display: flex;
            align-items: center;
            margin-right: 35px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }

        .logo-text {
            font-family: 'Michroma', sans-serif;
            font-size: 18px;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        /* Các liên kết menu bên trái */
        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ccc;
        }

        /* Khối chứa 3 nút bấm bên phải */
        .nav-right {
            display: flex;
            gap: 12px;
        }

        /* Nút bấm bo tròn độc lập (VND, ACCOUNT, Cart) */
        .action-btn {
            background: linear-gradient(180deg, rgba(50,50,50,0.9) 0%, rgba(20,20,20,0.9) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 12px 24px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: linear-gradient(180deg, rgba(70,70,70,0.9) 0%, rgba(30,30,30,0.9) 100%);
        }

        /* Hình nền giả lập giống khung cảnh mờ phía sau trong ảnh */
        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at 30% 60%, #15273b 0%, #050505 60%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Hình nền mờ tối màu -->
    <div class="hero-background"></div>

    <!-- Thanh thông báo ngang -->
    <div class="top-bar">
        Free shipping to Vietnam on all orders above ₫1,034,485
    </div>

    <!-- Khu vực Header trong suốt -->
    <header>
        <!-- Khối menu bên trái -->
        <div class="nav-left">
            <div class="logo">
                <!-- Mô phỏng biểu tượng logo Q -->
                <svg class="logo-icon" viewBox="0 0 100 100" fill="white">
                    <path d="M50 5C25 5 5 25 5 50C5 75 25 95 50 95C60 95 69 92 76 86L90 100L100 90L86 76C92 69 95 60 95 50C95 25 75 5 50 5ZM50 75C36 75 25 64 25 50C25 36 36 25 50 25C64 25 75 36 75 50C75 64 64 75 50 75Z"/>
                    <polygon points="65,65 85,85 75,85 60,70" fill="white"/>
                </svg>
                <span class="logo-text">quadrant</span>
            </div>
            <nav class="nav-links">
                <a href="#">About</a>
                <a href="#">Content</a>
                <a href="#">Partners</a>
                <a href="#">Store</a>
                <a href="#">Stories</a>
            </nav>
        </div>

        <!-- Khối nút bấm bên phải -->
        <div class="nav-right">
            <a href="#" class="action-btn">VND</a>
            <a href="#" class="action-btn">ACCOUNT</a>
            <a href="#" class="action-btn">Cart</a>
        </div>
    </header>

</body>
</html>
